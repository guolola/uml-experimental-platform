name: Deploy to BaoTa PM2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uml_user
          POSTGRES_PASSWORD: uml_ci_password
          POSTGRES_DB: uml_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uml_user -d uml_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for PlantUML tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify PlantUML jar
        run: test -f plantuml/build/libs/plantuml-1.2026.3beta8.jar

      - name: Start OnlyOffice Document Server for smoke tests
        run: |
          set -euo pipefail
          docker run -d \
            --name onlyoffice-documentserver \
            -p 8080:80 \
            -e JWT_ENABLED=true \
            -e JWT_SECRET=ci-onlyoffice-jwt-secret \
            onlyoffice/documentserver
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthcheck | grep -q true; then
              echo "OnlyOffice Document Server is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs onlyoffice-documentserver --tail 200
          exit 1

      - name: Build shared packages for tests
        run: |
          npm run build:contracts
          npm run build:prompts

      - name: Production PostgreSQL and OnlyOffice smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://uml_user:uml_ci_password@127.0.0.1:5432/uml_platform_ci
          API_HOST: 127.0.0.1
          API_PORT: 4191
          API_CORS_ORIGINS: http://127.0.0.1:4175
          RENDER_SERVICE_BASE_URL: http://127.0.0.1:4002
          RENDER_SERVICE_CORS_ORIGINS: http://127.0.0.1:4175
          ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8080
          PUBLIC_API_BASE_URL: http://127.0.0.1:4191
          ONLYOFFICE_JWT_SECRET: ci-onlyoffice-jwt-secret
          ONLYOFFICE_ACCESS_TOKEN_SECRET: ci-onlyoffice-access-secret
          UML_DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/uml-documents
          UML_PROVIDER_CONFIG_SECRET: ci-provider-secret
          UML_PROVIDER_SECRET_KEY: ci-provider-secret
          UML_PROVIDER_BASE_URL_ALLOWLIST: https://api.openai.com,https://ai.comfly.org
          UML_ALLOW_LEGACY_PROVIDER_TEST: "false"
          UML_ALLOW_PROJECT_LEGACY_PROVIDER_SETTINGS: "false"
          SMTP_HOST: smtp.example.test
          SMTP_PORT: "587"
          SMTP_USER: ci@example.test
          SMTP_PASS: ci-smtp-password
          SMTP_FROM: UML Platform CI <ci@example.test>
        run: |
          set -euo pipefail
          mkdir -p "$UML_DOCUMENT_STORAGE_DIR"
          npx tsx -e "
            async function main() {
              const { createApiServer } = await import('./apps/api/src/index.ts');
              const app = await createApiServer();
              try {
                const version = await app.inject({ method: 'GET', url: '/api/version' });
                if (version.statusCode !== 200) {
                  throw new Error('Version endpoint failed: ' + version.statusCode + ' ' + version.body);
                }
                const payload = JSON.parse(version.body);
                if (payload.nodeEnv !== 'production') {
                  throw new Error('Expected production nodeEnv, got ' + payload.nodeEnv);
                }
                if (!payload.features?.onlyOfficeDocumentServerConfigured) {
                  throw new Error('OnlyOffice should be configured in production smoke');
                }
              } finally {
                await app.close();
              }
            }
            main().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          "

      - name: Test
        env:
          ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8080
          PUBLIC_API_BASE_URL: http://127.0.0.1:4191
          ONLYOFFICE_JWT_SECRET: ci-onlyoffice-jwt-secret
          ONLYOFFICE_ACCESS_TOKEN_SECRET: ci-onlyoffice-access-secret
          UML_DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/uml-documents
        run: |
          npm run test:contracts
          npm run test:api
          npm run test:render
          npm run test:web

      - name: Build applications
        run: |
          npm run build:api
          npm run build:render
          VITE_APP_API_BASE_URL="" npm run build:web

      - name: Create release archive
        run: |
          set -euo pipefail
          RELEASE_DIR="release-${GITHUB_SHA}"
          mkdir -p "$RELEASE_DIR"

          cp package.json package-lock.json ecosystem.config.cjs "$RELEASE_DIR/"

          mkdir -p "$RELEASE_DIR/apps/api" "$RELEASE_DIR/apps/render-service" "$RELEASE_DIR/apps/web"
          cp apps/api/package.json "$RELEASE_DIR/apps/api/"
          cp apps/render-service/package.json "$RELEASE_DIR/apps/render-service/"
          cp apps/web/package.json "$RELEASE_DIR/apps/web/"
          cp -R apps/api/dist "$RELEASE_DIR/apps/api/dist"
          cp -R apps/render-service/dist "$RELEASE_DIR/apps/render-service/dist"
          cp -R apps/web/dist "$RELEASE_DIR/apps/web/dist"

          mkdir -p "$RELEASE_DIR/packages/contracts" "$RELEASE_DIR/packages/prompts"
          cp packages/contracts/package.json "$RELEASE_DIR/packages/contracts/"
          cp packages/prompts/package.json "$RELEASE_DIR/packages/prompts/"
          cp -R packages/contracts/dist "$RELEASE_DIR/packages/contracts/dist"
          cp -R packages/prompts/dist "$RELEASE_DIR/packages/prompts/dist"

          mkdir -p "$RELEASE_DIR/plantuml/build/libs"
          cp plantuml/build/libs/plantuml-1.2026.3beta8.jar "$RELEASE_DIR/plantuml/build/libs/"

          mkdir -p "$RELEASE_DIR/scripts/deploy"
          cp scripts/deploy/baota-pm2-deploy.sh "$RELEASE_DIR/scripts/deploy/"

          tar -czf "uml-platform-${GITHUB_SHA}.tar.gz" -C "$RELEASE_DIR" .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Missing GitHub secret: DEPLOY_HOST" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_PORT" ]; then
            echo "Missing GitHub secret: DEPLOY_PORT, or set it to 22" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing GitHub secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key for $DEPLOY_HOST:$DEPLOY_PORT ..."
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_USER" ]; then
            echo "Missing GitHub secret: DEPLOY_USER" >&2
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "uml-platform-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/uml-platform-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            scripts/deploy/baota-pm2-deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/baota-pm2-deploy.sh"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/uml-platform' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/baota-pm2-deploy.sh && DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='${GITHUB_SHA}' RELEASE_ARCHIVE='/tmp/uml-platform-${GITHUB_SHA}.tar.gz' bash /tmp/baota-pm2-deploy.sh"
