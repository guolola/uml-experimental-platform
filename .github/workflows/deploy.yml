name: Deploy to BaoTa PM2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uml_user
          POSTGRES_PASSWORD: uml_ci_password
          POSTGRES_DB: uml_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uml_user -d uml_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for PlantUML tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify PlantUML jar
        run: test -f plantuml/build/libs/plantuml-1.2026.3beta8.jar

      - name: Start OnlyOffice Document Server for smoke tests
        run: |
          set -euo pipefail
          docker run -d \
            --name onlyoffice-documentserver \
            -p 8080:80 \
            -e JWT_ENABLED=true \
            -e JWT_SECRET=ci-onlyoffice-jwt-secret \
            onlyoffice/documentserver
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthcheck | grep -q true; then
              echo "OnlyOffice Document Server is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs onlyoffice-documentserver --tail 200
          exit 1

      - name: Build shared packages for tests
        run: |
          npm run build:contracts
          npm run build:prompts

      - name: Production PostgreSQL and OnlyOffice smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://uml_user:uml_ci_password@127.0.0.1:5432/uml_platform_ci
          API_HOST: 127.0.0.1
          API_PORT: 4191
          API_CORS_ORIGINS: http://127.0.0.1:4175
          RENDER_SERVICE_BASE_URL: http://127.0.0.1:4002
          RENDER_SERVICE_CORS_ORIGINS: http://127.0.0.1:4175
          ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8080
          PUBLIC_API_BASE_URL: http://127.0.0.1:4191
          ONLYOFFICE_JWT_SECRET: ci-onlyoffice-jwt-secret
          ONLYOFFICE_ACCESS_TOKEN_SECRET: ci-onlyoffice-access-secret
          UML_DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/uml-documents
          UML_PROVIDER_CONFIG_SECRET: ci-provider-secret
          UML_PROVIDER_SECRET_KEY: ci-provider-secret
          UML_PROVIDER_BASE_URL_ALLOWLIST: https://api.openai.com,https://ai.comfly.org
          UML_ALLOW_LEGACY_PROVIDER_TEST: "false"
          UML_ALLOW_PROJECT_LEGACY_PROVIDER_SETTINGS: "false"
          SMTP_HOST: smtp.example.test
          SMTP_PORT: "587"
          SMTP_USER: ci@example.test
          SMTP_PASS: ci-smtp-password
          SMTP_FROM: UML Platform CI <ci@example.test>
        run: |
          set -euo pipefail
          mkdir -p "$UML_DOCUMENT_STORAGE_DIR"
          npx tsx -e "
            async function main() {
              const { createApiServer } = await import('./apps/api/src/index.ts');
              const app = await createApiServer();
              try {
                const version = await app.inject({ method: 'GET', url: '/api/version' });
                if (version.statusCode !== 200) {
                  throw new Error('Version endpoint failed: ' + version.statusCode + ' ' + version.body);
                }
                const payload = JSON.parse(version.body);
                if (payload.nodeEnv !== 'production') {
                  throw new Error('Expected production nodeEnv, got ' + payload.nodeEnv);
                }
                if (!payload.features?.onlyOfficeDocumentServerConfigured) {
                  throw new Error('OnlyOffice should be configured in production smoke');
                }
              } finally {
                await app.close();
              }
            }
            main().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          "

      - name: Test
        env:
          ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8080
          PUBLIC_API_BASE_URL: http://127.0.0.1:4191
          ONLYOFFICE_JWT_SECRET: ci-onlyoffice-jwt-secret
          ONLYOFFICE_ACCESS_TOKEN_SECRET: ci-onlyoffice-access-secret
          UML_DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/uml-documents
        run: |
          npm run test:contracts
          npm run test:api
          npm run test:render
          npm run test:web

      - name: Build production bundles
        run: |
          set -euo pipefail
          npm run build:api
          npm run build:render
          npm run build:web:production

      - name: Verify production web API base
        run: |
          set -euo pipefail
          matches="$(
            find apps/web/dist -type f \( -name 'index.html' -o -name '*.js' \) \
              -exec grep -HnE '(127\.0\.0\.1|localhost):(4001|4101)' {} + || true
          )"
          if [ -n "$matches" ]; then
            echo "Production web bundle contains a local API base URL." >&2
            echo "Build with npm run build:web:production so browser requests use same-origin /api." >&2
            echo "$matches" >&2
            exit 1
          fi

      - name: Push deploy mirror
        env:
          DEPLOY_MIRROR_PUSH_URL: ${{ secrets.DEPLOY_MIRROR_PUSH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_MIRROR_PUSH_URL:-}" ]; then
            echo "DEPLOY_MIRROR_PUSH_URL is not configured; skipping mirror push."
            exit 0
          fi
          git push --force "$DEPLOY_MIRROR_PUSH_URL" \
            "${GITHUB_SHA}:refs/heads/deploy-main"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Missing GitHub secret: DEPLOY_HOST" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_PORT" ]; then
            echo "Missing GitHub secret: DEPLOY_PORT, or set it to 22" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing GitHub secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key for $DEPLOY_HOST:$DEPLOY_PORT ..."
          ssh-keyscan -T 20 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts || \
            echo "Warning: ssh-keyscan failed; deploy steps will use StrictHostKeyChecking=accept-new."

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/uml-platform' }}
          DEPLOY_REPO_URL: ${{ secrets.DEPLOY_REPO_URL }}
          DEPLOY_MIRROR_PUSH_URL: ${{ secrets.DEPLOY_MIRROR_PUSH_URL }}
          FALLBACK_REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_USER" ]; then
            echo "Missing GitHub secret: DEPLOY_USER" >&2
            exit 1
          fi
          REPO_URL="${DEPLOY_REPO_URL:-$FALLBACK_REPO_URL}"
          SOURCE_REF="${GITHUB_REF_NAME}"
          if [ -n "${DEPLOY_MIRROR_PUSH_URL:-}" ]; then
            if [ -z "${DEPLOY_REPO_URL:-}" ]; then
              echo "DEPLOY_REPO_URL is required when DEPLOY_MIRROR_PUSH_URL is configured." >&2
              exit 1
            fi
            SOURCE_REF="deploy-main"
          fi
          SSH_OPTIONS=(
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o ConnectTimeout=30
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
          )
          ssh "${SSH_OPTIONS[@]}" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='${GITHUB_SHA}' SOURCE_REF='$SOURCE_REF' REPO_URL='$REPO_URL' bash -s" <<'REMOTE_DEPLOY'
          set -Eeuo pipefail

          NPM_REGISTRY="${NPM_REGISTRY:-https://registry.npmmirror.com}"
          SOURCE_DIR="$DEPLOY_PATH/shared/source"

          log_deploy() {
            printf '[deploy][%s] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"
          }

          run_timed() {
            local label="$1"
            shift
            local started_at
            local finished_at
            local status
            started_at="$(date +%s)"
            log_deploy "START $label"
            set +e
            "$@"
            status="$?"
            set -e
            finished_at="$(date +%s)"
            log_deploy "END $label status=$status duration=$((finished_at - started_at))s"
            return "$status"
          }

          command -v git >/dev/null || {
            echo "git is required on the server" >&2
            exit 1
          }
          command -v node >/dev/null || {
            echo "node is required on the server" >&2
            exit 1
          }
          command -v npm >/dev/null || {
            echo "npm is required on the server" >&2
            exit 1
          }

          git_network() {
            local attempt
            for attempt in 1 2 3; do
              if git -c http.version=HTTP/1.1 "$@"; then
                return 0
              fi
              echo "git $* failed on attempt $attempt/3; retrying after network backoff ..." >&2
              sleep "$((attempt * 5))"
            done
            git -c http.version=HTTP/1.1 "$@"
          }

          mkdir -p "$DEPLOY_PATH/incoming" "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared"

          if [ -e "$SOURCE_DIR" ] && [ ! -d "$SOURCE_DIR/.git" ]; then
            echo "Refusing to overwrite non-git source directory: $SOURCE_DIR" >&2
            exit 1
          fi

          if [ ! -d "$SOURCE_DIR/.git" ]; then
            echo "Cloning source repository into $SOURCE_DIR ..."
            run_timed "git clone source checkout" \
              git_network clone --filter=blob:none --no-checkout "$REPO_URL" "$SOURCE_DIR"
          fi

          log_deploy "Fetching $SOURCE_REF for release $RELEASE_SHA from $REPO_URL"
          git -C "$SOURCE_DIR" remote set-url origin "$REPO_URL"
          run_timed "git fetch $SOURCE_REF" \
            git_network -C "$SOURCE_DIR" fetch --prune --depth=1 origin \
            "+refs/heads/$SOURCE_REF:refs/remotes/origin/$SOURCE_REF"
          if ! git -C "$SOURCE_DIR" cat-file -e "$RELEASE_SHA^{commit}" 2>/dev/null; then
            run_timed "git fetch release sha fallback" \
              git_network -C "$SOURCE_DIR" fetch --depth=1 origin "$RELEASE_SHA"
          fi
          run_timed "git checkout release sha" \
            git -C "$SOURCE_DIR" checkout --force "$RELEASE_SHA"
          run_timed "git clean source checkout" \
            git -C "$SOURCE_DIR" clean -fdx

          DEPLOY_PATH="$DEPLOY_PATH" \
            RELEASE_SHA="$RELEASE_SHA" \
            SOURCE_DIR="$SOURCE_DIR" \
            NPM_REGISTRY="$NPM_REGISTRY" \
            bash "$SOURCE_DIR/scripts/deploy/baota-pm2-git-deploy.sh"
          REMOTE_DEPLOY
